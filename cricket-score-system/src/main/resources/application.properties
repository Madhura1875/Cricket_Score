spring.application.name=cricket-score-system
server.port=8080

# ---- Database: in-memory H2 by default (data resets on restart, demo data is re-seeded) ----
spring.datasource.url=jdbc:h2:mem:cricketdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# To keep data between restarts use a file database instead:
# spring.datasource.url=jdbc:h2:file:./data/cricketdb

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:cricketdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---- Monitoring: /actuator/health, /actuator/metrics ----
management.endpoints.web.exposure.include=health,info,metrics

# ---- Live simulation ----
cricket.simulation.enabled=true
# one delivery every 2.5 seconds per live match (lower = faster)
cricket.simulation.interval-ms=2500
cricket.simulation.initial-delay-ms=3000

# ---- Demo data (4 teams + 3 matches on startup) ----
cricket.seed.enabled=true

# Activate with:  java -jar target/cricket-score-system-1.0.0.jar --spring.profiles.active=postgres
# Override the values with environment variables in real deployments.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cricket}
spring.datasource.username=${DB_USER:cricket}
spring.datasource.password=${DB_PASSWORD:cricket}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# With several instances behind a load balancer, keep the simulator on ONE instance only:
# cricket.simulation.enabled=false
# cricket.seed.enabled=false
